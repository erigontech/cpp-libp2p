syntax = "proto2";

package pubsub.pb;

message RPC {
	repeated SubOpts subscriptions = 1;
	repeated Message publish = 2;

	message SubOpts {
		optional bool subscribe = 1; // subscribe or unsubcribe
		optional string topicid = 2;
		// Partial messages extension: the sender prefers partial messages on
		// the topic (and supports sending them)
		optional bool requestsPartial = 3;
		// Partial messages extension: the sender supports sending partial
		// messages on the topic
		optional bool supportsSendingPartial = 4;
	}

	optional ControlMessage control = 3;

	// gossipsub v1.3 extensions (libp2p/specs
	// pubsub/gossipsub/extensions/extensions.proto)
	optional PartialMessagesExtension partial = 10;
}

message Message {
	optional bytes from = 1;
	optional bytes data = 2;
	optional bytes seqno = 3;
	optional string topic = 4;
	optional bytes signature = 5;
	optional bytes key = 6;
}

message ControlMessage {
	repeated ControlIHave ihave = 1;
	repeated ControlIWant iwant = 2;
	repeated ControlGraft graft = 3;
	repeated ControlPrune prune = 4;
	repeated ControlIDontWant idontwant = 5;
	// gossipsub v1.3: only in the first message on a stream
	optional ControlExtensions extensions = 6;
}

// gossipsub v1.3 Extensions control message: the extensions the sender
// supports
message ControlExtensions {
	optional bool partialMessages = 10;
}

// Partial messages extension (libp2p/specs
// pubsub/gossipsub/partial-messages.md): the encodings of the parts and of
// the parts metadata are defined by the application
message PartialMessagesExtension {
	optional bytes topicID = 1;
	optional bytes groupID = 2;
	// One or more parts of the message of the group
	optional bytes partialMessage = 3;
	// The parts the sender has and wants
	optional bytes partsMetadata = 4;
}

message ControlIDontWant {
	repeated bytes messageIDs = 1;
}

message ControlIHave {
	optional string topicID = 1;
	repeated bytes messageIDs = 2;
}

message ControlIWant {
	repeated bytes messageIDs = 1;
}

message ControlGraft {
	optional string topicID = 1;
}

message PeerInfo {
	optional bytes peerID = 1;
	optional bytes signedPeerRecord = 2;
}

message ControlPrune {
	optional string topicID = 1;
	repeated PeerInfo peers = 2;
	optional uint64 backoff = 3;
}
